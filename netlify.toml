# Netlify: сборка Vite.
#
# Все редиректы вынесены в public/_redirects (доменные 301 выше SPA-фолбэка).
# В netlify.toml правил редиректа НЕТ намеренно: правила из netlify.toml
# применяются РАНЬШЕ правил из _redirects, поэтому SPA-фолбэк здесь перекрыл бы
# доменные 301 со старого домена на новый.
[build]
  command = "npm run build"
  publish = "dist"
